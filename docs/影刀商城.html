<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>影刀商城定单确认发货</title>
</head>

<body
    style="font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #333; margin: 20px; background-color: #f8f9fa;">

    <h1
        style="color: #0066cc; text-align: center; font-size: 20px; font-weight: bold; padding-bottom: 5px; margin-bottom: 25px;">
        影刀商城定单确认发货</h1>

    <h2
        style="color: #34495e; font-size: 16px; font-weight: normal; margin-top: 10px; margin-bottom: 10px; padding-left: 12px;">
        功能说明：</h2>
    <div style="background-color: #f9f9f9; border: 1px solid #eee; border-radius: 4px; margin: 10px 0; padding: 0;">
        <p style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px; font-weight: normal;">对订单管理页面的所有定单确认发货</p>
    </div>

    <h2
        style="color: #34495e; font-size: 16px; font-weight: normal; margin-top: 10px; margin-bottom: 10px; padding-left: 12px;">
        操作步骤：</h2>
    <div style="background-color: #f9f9f9; border: 1px solid #eee; border-radius: 4px; margin: 10px 0; padding: 0;">
        <ul style="margin: 0; padding: 0; list-style: none;">
            <li style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px;"><span
                    style="font-weight: bold; color: #28a745;">第一步：</span>打开登录页面</li>
            <li style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px;"><span
                    style="font-weight: bold; color: #28a745;">第二步：</span>输入账号密码，登录系统</li>
            <li style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px;"><span
                    style="font-weight: bold; color: #28a745;">第三步：</span>进入"订单管理"页面</li>
            <li style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px;"><span
                    style="font-weight: bold; color: #28a745;">第四步：</span>输入商品名称，查询商品</li>
            <li style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px;"><span
                    style="font-weight: bold; color: #28a745;">第五步：</span>在查询结果中，对每一条订单，点击操作列的"确认发货"链接，确认发货。</li>
            <li style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px;"><span
                    style="font-weight: bold; color: #28a745;">第六步：</span>如果有多页订单，翻页处理所有页面。</li>
            <li style="margin: 0; padding: 10px 0 10px 24px; font-size: 14px;"><span
                    style="font-weight: bold; color: #28a745;">第七步：</span>将所有确认发货的订单信息抓取到excel文件中</li>
        </ul>
    </div>

    <div style="background-color: #f9f9f9; border: 1px dashed #b3d7ff; border-radius: 4px; margin: 20px 0; padding: 0;">
        <h3 style="color: #007bff; margin: 0 0 8px 24px; font-size: 15px;">注意事项：</h3>
        <p style="margin: 0 0 0 24px; padding: 10px 0 10px 0; color: #0056b3;">请确保网络连接稳定，操作过程中不要关闭浏览器窗口。</p>
    </div>

    <div style="background-color: #fffbe6; border: 1px solid #ffeaa7; border-radius: 4px; margin: 15px 0; padding: 0;">
        <p style="margin: 0; padding: 10px 0 10px 24px; color: #856404; font-weight: bold;">⚠️ 重要提示：操作前请备份重要数据</p>
    </div>
</body>

</html>
