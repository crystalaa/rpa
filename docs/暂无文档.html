<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>银行账户补采</title>
    <style>
        body {
            font-family:  "Microsoft YaHei", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            margin: 20px;
            background-color: #fff;
        }

        h1 {
            color: dodgerblue;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 5px;
            margin-bottom: 25px;
        }

        h2 {
            color: #34495e;
            font-size: 16px;
            font-weight: normal;
            margin-top: 10px;
            margin-bottom: 10px;
            padding-left: 12px;
        }

        blockquote {
            background-color: #fff;
            border-left: 2px solid sandybrown;
            margin: 10px 0;
            padding: 15px 20px;
            background-color: #f9f9f9;
        }

        blockquote p {
            margin: 0;
            font-size: 14px;
            color: #333;
            font-weight: normal;
        }

        ul {
            margin: 15px 0;
            padding-left: 20px;
        }

        li {
            list-style: none;
            margin: 8px 0;
            padding: 0;
            color: #333;
        }

        .step-number {
            color: #333;
            font-weight: normal;
        }
        .highlight {
            color: darkorange;
            font-weight: bold;
        }
    </style>
</head>
