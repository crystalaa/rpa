    <h1>银行对账单查询【手工采集】</h1>
    <h2>功能说明：</h2>
    <blockquote>
            <p>读取配置文件的信息，自动采集银行对账单信息</p>

<!--		<p>自动审核<span class="highlight">“协同状态”</span>等于<span class="highlight">“不需协同申请”</span>且<span class="highlight">“分录摘要”</span>包含<span class="highlight">“社保、公积金、社会保险、个税、个人所得税、五险一金、企业年金、补充医疗保险”</span>的记录，同意<span class="highlight">“不需协同批复”</span>。</p>-->
    </blockquote>

    <h2>操作步骤：</h2>
    <blockquote>
        <ul>
            <li><span class="step-number">第一步：</span>打开<span class="highlight">"登录页面"</span>。</li>
            <li><span class="step-number">第二步：</span>输入账号密码，<span class="highlight">"登录系统"</span>。</li>
			<li><span class="step-number">第三步：</span>导航到<span class="highlight">"银行对账单查询"</span>页面。</li>
            <li><span class="step-number">第四步：</span>点击<span class="highlight">"手工采集"</span>按钮。</li>
            <li><span class="step-number">第五步：</span>设置<span class="highlight">"账号"、"日期"</span>选项为<span class="highlight">配置文件中的值</span>。</li>
            <li><span class="step-number">第六步：</span>点击<span class="highlight">"确认"</span>按钮。</li>
        </ul>
    </blockquote>
